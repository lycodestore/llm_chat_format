<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM 请求/响应体格式化工具</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --card: #ffffff;
      --border: #dbe3ef;
      --text: #172033;
      --muted: #5f6b85;
      --primary: #245bdb;
      --system: #6d3be5;
      --user: #0f8a5f;
      --assistant: #2563eb;
      --tool: #b35b00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 96vw;
      margin: 0 auto;
      padding: 12px 16px;
    }

    .header {
      margin-bottom: 16px;
    }

    .title {
      margin: 0;
      font-size: 22px;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }

    button {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    button.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--card);
      min-height: 600px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel h2 {
      margin: 0;
      font-size: 15px;
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    textarea {
      width: 100%;
      flex: 1;
      border: 0;
      resize: none;
      outline: none;
      padding: 12px;
      font-size: 14px;
      line-height: 1.6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: var(--text);
    }

    .output {
      padding: 12px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .block {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .block .label {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: #f9fbff;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 10px;
      font-size: 13px;
      line-height: 1.55;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
    }

    .msg {
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .msg-head {
      font-size: 12px;
      padding: 6px 10px;
      color: #fff;
    }

    .msg pre {
      background: #fff;
    }

    .msg-section {
      border-top: 1px dashed var(--border);
    }

    .msg-section-title {
      font-size: 12px;
      color: var(--muted);
      padding: 8px 10px 0;
    }

    .meta {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f9fbff;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .api-format {
      margin-left: 8px;
      display: inline-block;
      font-weight: 600;
      color: #334669;
    }

    .badge-system { background: var(--system); }
    .badge-user { background: var(--user); }
    .badge-assistant { background: var(--assistant); }
    .badge-tool { background: var(--tool); }
    .badge-default { background: #51607c; }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      padding: 10px;
    }

    .error {
      color: #a93a32;
      background: #fff3f1;
      border-top: 1px solid #f3c7c2;
      padding: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .panel {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 class="title">LLM 请求/响应体格式化工具</h1>
      <p class="subtitle">左侧粘贴原始文本（JSON 或普通文本），右侧实时还原换行并提升可读性。</p>
    </header>

    <section class="toolbar">
      <button id="btnFormat" class="primary">立即格式化</button>
      <button id="btnSample">填充示例</button>
      <button id="btnCopy">复制右侧结果</button>
      <button id="btnClear">清空</button>
    </section>

    <section class="grid">
      <article class="panel">
        <h2>原始输入</h2>
        <textarea id="inputText" placeholder="在这里粘贴 agent 与 LLM API 的请求体或响应体..."></textarea>
      </article>

      <article class="panel">
        <h2>格式化结果</h2>
        <div class="output">
          <div class="block">
            <div class="label">对话视图 <span id="apiFormatTag" class="api-format">API 格式：未识别</span></div>
            <div id="messagesView" class="messages"></div>
          </div>
        </div>
        <div id="errorBox" class="error" style="display: none;"></div>
      </article>
    </section>
  </main>

  <script>
    const inputEl = document.getElementById("inputText");
    const messagesViewEl = document.getElementById("messagesView");
    const errorBoxEl = document.getElementById("errorBox");
    const apiFormatTagEl = document.getElementById("apiFormatTag");

    const SAMPLE = `{
  "model": "deepseek-v4-flash",
  "max_tokens": 32000,
  "messages": [
    {
      "role": "system",
      "content": "You are a title generator. You output ONLY a thread title. Nothing else.\\n\\n<task>\\nGenerate a brief title that would help the user find this conversation later.\\n</task>"
    },
    {
      "role": "user",
      "content": "Generate a title for this conversation:\\n"
    },
    {
      "role": "user",
      "content": "创建一个网页版的todo应用"
    }
  ],
  "stream": true
}`;

    function decodeEscapedText(text) {
      if (!text) return "";
      let t = String(text);
      t = t.replace(/\\\\n/g, "\n");
      t = t.replace(/\\\\r/g, "\r");
      t = t.replace(/\\\\t/g, "\t");
      t = t.replace(/\\\\"/g, "\"");
      t = t.replace(/\\\\\\\\/g, "\\");
      return t;
    }

    function readableStringify(value) {
      const seen = new WeakSet();
      return JSON.stringify(
        value,
        (key, val) => {
          if (typeof val === "object" && val !== null) {
            if (seen.has(val)) return "[Circular]";
            seen.add(val);
          }
          if (typeof val === "string") return decodeEscapedText(val);
          return val;
        },
        2
      );
    }

    function normalizeContent(value) {
      if (value === null || value === undefined) return "";
      if (typeof value === "string") return decodeEscapedText(value);
      if (Array.isArray(value)) {
        return value
          .map((part) => {
            if (typeof part === "string") return decodeEscapedText(part);
            if (!part || typeof part !== "object") return readableStringify(part);
            if (typeof part.text === "string") return decodeEscapedText(part.text);
            if (typeof part.content === "string") return decodeEscapedText(part.content);
            return readableStringify(part);
          })
          .join("\n");
      }
      return readableStringify(value);
    }

    function setApiFormatTag(text) {
      apiFormatTagEl.textContent = `API 格式：${text}`;
    }

    function isOpenAIToolDef(tool) {
      if (!tool || typeof tool !== "object") return false;
      if (tool.type === "function") return true;
      return !!(tool.function && typeof tool.function === "object");
    }

    function isAnthropicToolDef(tool) {
      if (!tool || typeof tool !== "object") return false;
      if (isOpenAIToolDef(tool)) return false;
      return typeof tool.name === "string" || tool.input_schema !== undefined;
    }

    function detectApiFormat(parsed) {
      if (!parsed || typeof parsed !== "object") {
        return { vendor: "unknown", kind: "unknown", label: "未识别" };
      }

      if (Array.isArray(parsed.choices) || (typeof parsed.object === "string" && parsed.object.includes("chat.completion"))) {
        return {
          vendor: "openai",
          kind: Array.isArray(parsed.choices) ? "response" : "unknown",
          label: Array.isArray(parsed.choices) ? "OpenAI 响应体" : "OpenAI"
        };
      }

      if (typeof parsed.type === "string" && parsed.type === "message" && Array.isArray(parsed.content)) {
        return { vendor: "anthropic", kind: "response", label: "Anthropic 响应体" };
      }

      if (Array.isArray(parsed.tools) && parsed.tools.some(isOpenAIToolDef)) {
        return { vendor: "openai", kind: "request", label: "OpenAI 请求体" };
      }

      if (parsed.tool_choice !== undefined || parsed.stream_options !== undefined) {
        return { vendor: "openai", kind: "request", label: "OpenAI 请求体" };
      }

      const hasAnthropicRequestMarkers =
        Array.isArray(parsed.system) ||
        typeof parsed.system === "string" ||
        (Array.isArray(parsed.tools) && parsed.tools.some(isAnthropicToolDef)) ||
        (!!parsed.tools && typeof parsed.tools === "object") ||
        !!parsed.context_management ||
        !!parsed.output_config ||
        !!parsed.thinking;

      if (hasAnthropicRequestMarkers && Array.isArray(parsed.messages)) {
        return { vendor: "anthropic", kind: "request", label: "Anthropic 请求体" };
      }

      if (Array.isArray(parsed.system) && Array.isArray(parsed.messages)) {
        return { vendor: "anthropic", kind: "request", label: "Anthropic 请求体" };
      }

      if (Array.isArray(parsed.messages)) {
        const hasAnthropicStyleBlock = parsed.messages.some((m) => Array.isArray(m?.content));
        if (hasAnthropicStyleBlock) {
          return { vendor: "anthropic", kind: "request", label: "Anthropic 请求体" };
        }
        return { vendor: "openai", kind: "request", label: "OpenAI 请求体" };
      }

      return { vendor: "unknown", kind: "unknown", label: "未识别" };
    }

    function extractOpenAIData(parsed) {
      const meta = [];
      const items = [];

      if (parsed && typeof parsed === "object") {
        if (parsed.model) meta.push(`model: ${parsed.model}`);
        if (parsed.id) meta.push(`id: ${parsed.id}`);
        if (parsed.object) meta.push(`object: ${parsed.object}`);
        if (typeof parsed.created === "number") {
          const created = new Date(parsed.created * 1000).toLocaleString("zh-CN");
          meta.push(`created: ${created}`);
        }
      }

      if (Array.isArray(parsed.messages)) {
        parsed.messages.forEach((item, idx) => {
          const role = item && typeof item.role === "string" ? item.role : "unknown";
          let content = normalizeContent(item?.content);
          if ((!content || !content.trim()) && Array.isArray(item?.tool_calls) && item.tool_calls.length > 0) {
            content = readableStringify(item.tool_calls);
          }
          items.push({
            title: `#${idx + 1}  ${role}`,
            role,
            content,
            reasoning: normalizeContent(item?.reasoning_content)
          });
        });
      }

      if (Array.isArray(parsed.tools)) {
        meta.push(`tools_count: ${parsed.tools.length}`);
        parsed.tools.forEach((tool, idx) => {
          const func = tool?.function && typeof tool.function === "object" ? tool.function : tool;
          const toolType = typeof tool?.type === "string" ? tool.type : "function";
          const lines = [];
          lines.push(`type: ${toolType}`);
          lines.push(`name: ${func?.name ?? "unnamed"}`);
          if (func?.description) lines.push(`description: ${decodeEscapedText(func.description)}`);
          if (func?.parameters !== undefined) {
            lines.push("parameters:");
            lines.push(readableStringify(func.parameters));
          } else if (func?.input_schema !== undefined) {
            lines.push("input_schema:");
            lines.push(readableStringify(func.input_schema));
          }
          items.push({
            title: `[tool] #${idx + 1}  ${func?.name ?? "unnamed"}`,
            role: "tool",
            content: lines.join("\n"),
            reasoning: ""
          });
        });
      }

      if (Array.isArray(parsed.choices)) {
        parsed.choices.forEach((choice, idx) => {
          const msg = choice?.message || choice?.delta || {};
          const role = typeof msg.role === "string" ? msg.role : "assistant";
          let content = normalizeContent(msg.content);
          if (!content && msg.tool_calls) {
            content = readableStringify(msg.tool_calls);
          }
          const tail = [];
          if (choice && choice.finish_reason) tail.push(`finish: ${choice.finish_reason}`);
          if (typeof choice?.index === "number") tail.push(`index: ${choice.index}`);
          items.push({
            title: `choice #${idx + 1}  ${role}${tail.length ? `  (${tail.join(", ")})` : ""}`,
            role,
            content,
            reasoning: normalizeContent(msg.reasoning_content)
          });
        });
      }

      if (parsed?.usage && typeof parsed.usage === "object") {
        const usage = parsed.usage;
        const usageLine = [
          `prompt_tokens: ${usage.prompt_tokens ?? "-"}`,
          `completion_tokens: ${usage.completion_tokens ?? "-"}`,
          `total_tokens: ${usage.total_tokens ?? "-"}`
        ].join(" | ");
        meta.push(`usage: ${usageLine}`);
        const reasoningTokens = usage?.completion_tokens_details?.reasoning_tokens;
        if (typeof reasoningTokens === "number") {
          meta.push(`reasoning_tokens: ${reasoningTokens}`);
        }
      }

      return { items, meta };
    }

    function parseAnthropicContentBlocks(value) {
      if (value === null || value === undefined) {
        return { content: "", reasoning: "" };
      }
      if (typeof value === "string") {
        return { content: decodeEscapedText(value), reasoning: "" };
      }
      if (!Array.isArray(value)) {
        return { content: normalizeContent(value), reasoning: "" };
      }

      const contentParts = [];
      const reasoningParts = [];
      value.forEach((part) => {
        if (typeof part === "string") {
          contentParts.push(decodeEscapedText(part));
          return;
        }
        const type = part?.type;
        if (type === "thinking" || type === "reasoning") {
          reasoningParts.push(decodeEscapedText(part?.thinking ?? part?.text ?? ""));
          return;
        }
        if (type === "text" || type === "input_text" || type === "output_text") {
          contentParts.push(decodeEscapedText(part?.text ?? ""));
          return;
        }
        contentParts.push(readableStringify(part));
      });

      return {
        content: contentParts.join("\n"),
        reasoning: reasoningParts.join("\n")
      };
    }

    function formatAnthropicTool(tool) {
      if (!tool || typeof tool !== "object") {
        return normalizeContent(tool);
      }
      const lines = [];
      const openaiLike = tool?.function && typeof tool.function === "object" ? tool.function : null;
      const toolName = tool?.name ?? openaiLike?.name ?? "-";
      const toolDesc = tool?.description ?? openaiLike?.description;
      const schema = tool?.input_schema !== undefined ? tool.input_schema : openaiLike?.parameters;
      lines.push(`name: ${toolName}`);
      if (toolDesc) lines.push(`description: ${decodeEscapedText(toolDesc)}`);
      if (schema !== undefined) {
        lines.push("input_schema:");
        lines.push(readableStringify(schema));
      }
      return lines.join("\n");
    }

    function extractAnthropicData(parsed, kind) {
      const meta = [];
      const items = [];

      if (parsed && typeof parsed === "object") {
        if (parsed.model) meta.push(`model: ${parsed.model}`);
        if (parsed.id) meta.push(`id: ${parsed.id}`);
        if (parsed.type) meta.push(`type: ${parsed.type}`);
      }

      if (kind === "request") {
        if (Array.isArray(parsed.system)) {
          parsed.system.forEach((part, idx) => {
            items.push({
              title: `system #${idx + 1}`,
              role: "system",
              content: normalizeContent(part?.text ?? part),
              reasoning: ""
            });
          });
        } else if (typeof parsed.system === "string" && parsed.system.trim()) {
          items.push({
            title: "system",
            role: "system",
            content: decodeEscapedText(parsed.system),
            reasoning: ""
          });
        }

        if (Array.isArray(parsed.messages)) {
          parsed.messages.forEach((item, idx) => {
            const role = item && typeof item.role === "string" ? item.role : "unknown";
            const blockParsed = parseAnthropicContentBlocks(item?.content);
            items.push({
              title: `#${idx + 1}  ${role}`,
              role,
              content: blockParsed.content,
              reasoning: blockParsed.reasoning
            });
          });
        }

        const tools = Array.isArray(parsed.tools)
          ? parsed.tools
          : parsed.tools && typeof parsed.tools === "object"
            ? Object.values(parsed.tools)
            : [];
        if (parsed.tools !== undefined) {
          meta.push(`tools_count: ${tools.length}`);
        }
        if (tools.length > 0) {
          tools.forEach((tool, idx) => {
            const toolName = tool?.name ?? tool?.function?.name ?? "unnamed";
            items.push({
              title: `[tool] #${idx + 1}  ${toolName}`,
              role: "tool",
              content: formatAnthropicTool(tool),
              reasoning: ""
            });
          });
        }
      }

      if (kind === "response") {
        const role = typeof parsed.role === "string" ? parsed.role : "assistant";
        const blockParsed = parseAnthropicContentBlocks(parsed.content);
        items.push({
          title: `response  ${role}`,
          role,
          content: blockParsed.content,
          reasoning: blockParsed.reasoning
        });
        if (parsed.stop_reason) meta.push(`stop_reason: ${parsed.stop_reason}`);
        if (parsed.stop_sequence) meta.push(`stop_sequence: ${parsed.stop_sequence}`);
      }

      if (parsed?.usage && typeof parsed.usage === "object") {
        const usage = parsed.usage;
        const usageLine = [
          `input_tokens: ${usage.input_tokens ?? "-"}`,
          `output_tokens: ${usage.output_tokens ?? "-"}`,
          `cache_creation_input_tokens: ${usage.cache_creation_input_tokens ?? "-"}`,
          `cache_read_input_tokens: ${usage.cache_read_input_tokens ?? "-"}`
        ].join(" | ");
        meta.push(`usage: ${usageLine}`);
      }

      return { items, meta };
    }

    function roleClass(role) {
      switch (role) {
        case "system":
          return "badge-system";
        case "user":
          return "badge-user";
        case "assistant":
          return "badge-assistant";
        case "tool":
          return "badge-tool";
        default:
          return "badge-default";
      }
    }

    function renderMessages(data) {
      messagesViewEl.innerHTML = "";
      if (Array.isArray(data.meta) && data.meta.length) {
        const metaBox = document.createElement("div");
        metaBox.className = "meta";
        metaBox.textContent = data.meta.join("\n");
        messagesViewEl.appendChild(metaBox);
      }

      if (!Array.isArray(data.items) || data.items.length === 0) {
        messagesViewEl.innerHTML += '<div class="hint">未检测到可展示的 `messages` 或 `choices[].message` 内容。</div>';
        return;
      }

      data.items.forEach((item) => {
        const wrapper = document.createElement("div");
        wrapper.className = "msg";
        const header = document.createElement("div");
        header.className = `msg-head ${roleClass(item.role)}`;
        header.textContent = item.title;

        const contentSection = document.createElement("div");
        contentSection.className = "msg-section";
        const contentTitle = document.createElement("div");
        contentTitle.className = "msg-section-title";
        contentTitle.textContent = "content";
        const contentPre = document.createElement("pre");
        contentPre.textContent = item.content || "(empty)";
        contentSection.appendChild(contentTitle);
        contentSection.appendChild(contentPre);

        wrapper.appendChild(header);
        wrapper.appendChild(contentSection);

        if (item.reasoning) {
          const reasonSection = document.createElement("div");
          reasonSection.className = "msg-section";
          const reasonTitle = document.createElement("div");
          reasonTitle.className = "msg-section-title";
          reasonTitle.textContent = "reasoning_content";
          const reasonPre = document.createElement("pre");
          reasonPre.textContent = item.reasoning;
          reasonSection.appendChild(reasonTitle);
          reasonSection.appendChild(reasonPre);
          wrapper.appendChild(reasonSection);
        }

        messagesViewEl.appendChild(wrapper);
      });
    }

    function getCopyText() {
      const msgText = Array.from(messagesViewEl.querySelectorAll(".msg")).map((msg) => {
        const head = msg.querySelector(".msg-head")?.textContent || "";
        const sections = Array.from(msg.querySelectorAll(".msg-section")).map((section) => {
          const title = section.querySelector(".msg-section-title")?.textContent || "";
          const body = section.querySelector("pre")?.textContent || "";
          return `${title}:\n${body}`;
        });
        return `${head}\n${sections.join("\n\n")}`;
      });
      const meta = messagesViewEl.querySelector(".meta")?.textContent || "";
      const apiFormat = apiFormatTagEl.textContent || "API 格式：未识别";
      if (!msgText.length && !meta) return "暂无可复制的对话内容。";
      return "=== 对话视图 ===\n" + [apiFormat, meta, msgText.join("\n\n")].filter(Boolean).join("\n\n");
    }

    function formatInput() {
      const raw = inputEl.value || "";
      setApiFormatTag("未识别");
      messagesViewEl.innerHTML = '<div class="hint">输入 JSON 后会自动解析并展示消息卡片。</div>';
      errorBoxEl.style.display = "none";
      errorBoxEl.textContent = "";

      if (!raw.trim()) {
        return;
      }

      try {
        const parsed = JSON.parse(raw);
        const format = detectApiFormat(parsed);
        setApiFormatTag(format.label);
        let data = { items: [], meta: [] };
        if (format.vendor === "anthropic") {
          data = extractAnthropicData(parsed, format.kind);
        } else if (format.vendor === "openai") {
          data = extractOpenAIData(parsed);
        } else {
          data = extractOpenAIData(parsed);
        }
        renderMessages(data);
      } catch (err) {
        errorBoxEl.style.display = "block";
        errorBoxEl.textContent = `JSON 解析失败：${err.message}`;
      }
    }

    function copyOutput() {
      const text = getCopyText();
      navigator.clipboard.writeText(text).then(
        () => {
          const old = document.title;
          document.title = "已复制";
          setTimeout(() => {
            document.title = old;
          }, 500);
        },
        () => {
          errorBoxEl.style.display = "block";
          errorBoxEl.textContent = "复制失败，请手动复制右侧内容。";
        }
      );
    }

    document.getElementById("btnFormat").addEventListener("click", formatInput);
    document.getElementById("btnSample").addEventListener("click", () => {
      inputEl.value = SAMPLE;
      formatInput();
    });
    document.getElementById("btnClear").addEventListener("click", () => {
      inputEl.value = "";
      formatInput();
    });
    document.getElementById("btnCopy").addEventListener("click", copyOutput);
    inputEl.addEventListener("input", formatInput);

    formatInput();
  </script>
